const KEY='tla-personal-studio-starter-v1',PAGES=['Home','Style My Day','Three-Look Results','My Virtual Closet','My Style DNA','Inspiration Library','Virtual Try-On','Saved Looks'],NAV=[['Home','Home','house'],['Closet','My Virtual Closet','shirt'],['Style','Style My Day','sparkles'],['Inspo','Inspiration Library','images'],['Saved','Saved Looks','heart']];const DEFAULT={closet:[],inspo:[],saved:[],dna:{dial:55,bio:'',focus:['Chic Statement','Streetwear Statement','Fashion-Forward Statement'],interests:[],colors:'',fit:'',notes:''},collections:[],results:[],request:'',occasion:'Everyday',mode:'Closet Only'};let state;try{state=Object.assign({},DEFAULT,JSON.parse(localStorage.getItem(KEY))||{});state.dna=Object.assign({},DEFAULT.dna,state.dna||{});}catch{state=structuredClone(DEFAULT)};for(const k of ['closet','inspo','saved','collections','results'])if(!Array.isArray(state[k]))state[k]=[];let page='Home',filter='All',search='',selected=new Set(),inspoFilter='All',pickerType='closet',editTarget=null,selectedLooks=new Set(),previewSrc='',cropOriginal='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Browser storage is full. Your last change was not saved. Export your data before adding more photos.');return false}}function icon(name){const paths={house:'<path d="m3 10 9-7 9 7v11H3z"/><path d="M9 21v-8h6v8"/>',shirt:'<path d="m8 4-5 4 3 5 3-2v10h6V11l3 2 3-5-5-4-4 3z"/>',sparkles:'<path d="m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/>',images:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/>',heart:'<path d="M20.8 8.7c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11a4.8 4.8 0 0 1 8.8-2.5 4.8 4.8 0 0 1 8.8 2.5z"/>',hanger:'<path d="M10 6a2 2 0 1 1 3 1.7c-1 .6-1 1.4-1 2.3"/><path d="m12 10 9 7a2 2 0 0 1-1.3 3H4.3A2 2 0 0 1 3 17z"/>',arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>'};return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.sparkles}</svg>`}function go(p){page=p;selected.clear();search='';filter='All';render();window.scrollTo(0,0)}function btn(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}function banner(title,subtitle){const bannerId=({"Style My Day":"stylist","My Virtual Closet":"closet","My Style DNA":"dna","Inspiration Library":"inspiration","Virtual Try-On":"tryon","Saved Looks":"saved","Three-Look Results":"results"})[title]||"editorial";return `<section class="banner banner-${bannerId}"><div class="banner-content"><div class="eyebrow">THE LOOK ASSEMBLED · PERSONAL STUDIO</div><h1>${title}</h1><p>${subtitle}</p></div></section>`}function navs(){$('#desktop').innerHTML=PAGES.map(p=>`<button data-page="${p}" class="${page===p?'active':''}">${esc(p)}</button>`).join('');$('#bottom').innerHTML=NAV.map(([label,p,ico])=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(ico)}${label}</button>`).join('')}
function home(){const feats=[['closet','My Virtual Closet','My Virtual Closet'],['dna','My Style DNA','My Style DNA'],['inspiration','Inspiration Library','Inspiration Library'],['stylist','AI Stylist','Style My Day'],['tryon','Virtual Try-On','Virtual Try-On'],['saved','Saved Looks','Saved Looks']];return `<div class="page"><section class="home-hero"><div class="home-photo" aria-hidden="true"></div><div class="home-copy"><div class="home-brand">${icon('hanger')}<div>THE LOOK ASSEMBLED</div><small>MY AI STYLIST STUDIO</small></div><h1>Ordinary was Never<br>the Assignment.</h1><p>One app. Your closet. Your inspiration. AI does the styling.</p><button class="gold-cta" data-page="Style My Day">STYLE MY DAY ${icon('arrow')}</button><div style="color:var(--gold);font:21px Georgia,serif;margin-top:20px">AI-Powered Looks Just for You</div><img class="boards" src="outfit-board.jpg" alt="Three editorial outfit boards"></div></section><section class="feature-grid" aria-label="Studio features">${feats.map(([f,t,p])=>`<button class="feature" data-page="${p}"><img src="tile-${f}.jpg" alt="" loading="lazy"><span class="sr-only">${esc(t)}</span></button>`).join('')}</section><p class="footnote">Your private styling workspace · Images and notes saved locally in this browser · AI tools require a future secure connection.</p></div>`}
function cards(items,type){if(!items.length)return `<div class="empty">No pieces here yet. Add photos to start your collection.</div>`;return `<div class="grid">${items.map(item=>`<article class="card"><img class="photo" src="${item.data}" alt="${esc(item.name)}" loading="lazy"><div class="row"><h3 class="item-name">${esc(item.name)}</h3><input class="check" type="checkbox" data-select="${item.id}" aria-label="Select ${esc(item.name)}" ${selected.has(item.id)?'checked':''}></div><span class="pill">${esc(item.category||'Uncategorized')}</span><div class="image-tools"><button data-edit="${type}:${item.id}">Edit</button><button data-favorite="${type}:${item.id}" class="${item.favorite?'fav':''}" aria-label="Favorite">${item.favorite?'♥':'♡'}</button><button data-remove="${type}:${item.id}">Delete</button>${type==='inspo'?`<button data-crop="${item.id}">Crop & Focus</button>`:''}</div>${item.note?`<p class="muted">${esc(item.note)}</p>`:''}</article>`).join('')}</div>`}
function categoryChips(type){let arr=type==='closet'?state.closet:state.inspo;let cats=['All',...new Set(arr.map(x=>x.category||'Uncategorized'))];return `<div class="chips">${cats.map(c=>`<button class="chip ${(type==='closet'?filter:inspoFilter)===c?'selected':''}" data-filter="${esc(c)}" data-filter-type="${type}">${esc(c)}</button>`).join('')}</div>`}function gallery(type){const closet=type==='closet',title=closet?'My Virtual Closet':'Inspiration Library',desc=closet?'Your personal wardrobe, organized, styled, and ready for your next look.':'Inspired by the look. Styled for YOUR life.';let arr=state[type].filter(x=>(closet?filter:inspoFilter)==='All'||(x.category||'Uncategorized')===(closet?filter:inspoFilter));if(search)arr=arr.filter(x=>(x.name+' '+(x.note||'')+' '+(x.category||'')).toLowerCase().includes(search.toLowerCase()));return `<div class="page signature-page">${banner(title,desc)}${closet?`<div class="closet-toolbar"><div class="field"><label for="search">Search your closet</label><input id="search" placeholder="Search your closet (blazer, jeans, heels...)" value="${esc(search)}"></div><div class="actions">${btn('＋ Add Item','add-closet')}${btn('Manage Categories','categories','btn ghost')}</div></div><div class="category-scroll">${categoryChips('closet')}</div><div class="section-head"><h2>${arr.length} Closet Items</h2><span class="pill">Your personal wardrobe</span></div>`:`<div class="signature-tabs"><button class="chip selected" data-action="browse-inspo">Browse Inspiration</button><button class="chip" data-action="recreate-info">Recreate a Look</button><button class="chip" data-action="browse-inspo">My Inspirations</button><button class="chip" data-page="Saved Looks">Saved Looks</button></div><div class="inspo-intro"><section class="card"><h2>Recreate a Look You Love</h2><p>Upload a photo or choose from your inspiration library and build your own interpretation.</p><div class="actions">${btn('＋ Upload Inspiration','add-inspo')}${btn('Choose from My Library','browse-inspo','btn ghost')}</div></section><section class="card"><h2>✦ How It Works</h2><div class="how-steps"><span>① Pick a Look</span><span>② Get Styled*</span><span>③ Save & Wear</span></div><p class="muted">*AI recreation requires a secure service connection.</p></section></div><div class="section-head"><h2>Your Inspiration Library</h2><span class="pill">Closest Match · My Closet, My Way · Creative Remix</span></div><div class="field"><label for="search">Search inspiration</label><input id="search" placeholder="Search looks, occasions, notes..." value="${esc(search)}"></div><div class="category-scroll">${categoryChips('inspo')}</div>`}<div class="actions"><span class="muted">${arr.length} photos</span>${btn(`Delete Selected (${selected.size})`,'bulk-delete','btn danger small')}${btn('Clear Selection','clear-select','btn ghost small')}${btn('Export My Data','export','btn ghost small')}</div><section class="section signature-gallery">${cards(arr,type)}</section><div class="notice">Your photos are stored locally in this browser, not synced. Export your data regularly. Deletions require confirmation. Inspiration originals are kept unless you choose Replace.</div></div>`}
const occasions=['Everyday','Work','Date Night','Travel','Event','Active','Custom'],focuses=['Chic Statement','Streetwear Statement','Fashion-Forward Statement','Casual Everyday','Work Elevated','My Style DNA'];function styling(){const count=state.closet.length;return `<div class="page studio-styling">${banner('Style My Day','Your signature style begins with a vision. Tell us where you are going.')}<div class="styling-intro"><span class="eyebrow">THE PERSONAL STYLING ATELIER</span><h2>Let's assemble your next statement.</h2><p>Start with the look you actually want. Your wardrobe comes first; suggestions are always optional.</p></div><div class="layout2 styling-layout"><section class="card styling-form"><div class="step-heading"><span>01</span><div><div class="eyebrow">THE BRIEF</div><h3>Tell Your Stylist</h3></div></div><div class="field"><label for="request">What are we styling today?</label><textarea id="request" rows="4" placeholder="A polished brunch look with heels, something chic but unexpected...">${esc(state.request||'')}</textarea><small class="field-help">Describe the occasion, mood, pieces, colors, or finishing touches you love.</small></div><div class="field"><label for="mode">Build looks using</label><select id="mode"><option ${state.mode==='Closet Only'?'selected':''}>Closet Only</option><option ${state.mode==='Closet + Suggestions'?'selected':''}>Closet + Suggestions</option></select><small class="field-help">${count} closet item${count===1?'':'s'} saved · Suggestions will never be labeled as items you own.</small></div><div class="step-heading compact"><span>02</span><div><div class="eyebrow">THE OCCASION</div><h3>Where are we going?</h3></div></div><div class="chips occasion-chips">${occasions.map(x=>`<button class="chip ${state.occasion===x?'selected':''}" data-occasion="${x}" aria-pressed="${state.occasion===x}">${x}</button>`).join('')}</div><div class="step-heading compact"><span>03</span><div><div class="eyebrow">THE PERSONALITY</div><h3>Turn up your signature.</h3></div></div><div class="field"><label for="dial">Style Dial <strong id="dialLabel">${state.dna.dial}% Statement Maker</strong></label><input id="dial" class="dial" type="range" min="0" max="100" value="${state.dna.dial}"><div class="dial-ends"><span>Effortlessly classic</span><span>Unapologetically bold</span></div></div><p class="muted">Select up to three styling directions</p><div class="style-cards refined-style-cards">${focuses.map(x=>`<button class="style-card ${(state.dna.focus||[]).includes(x)?'selected':''}" data-focus="${x}" aria-pressed="${(state.dna.focus||[]).includes(x)}"><span class="style-card-mark">✦</span>${x}</button>`).join('')}</div><div class="actions full-action">${btn('✦ SAVE MY BRIEF & CONTINUE','generate')}</div><p class="field-help">Your brief is saved locally. AI look generation is not connected yet.</p></section><aside class="styling-aside"><div class="card editorial-panel"><div class="eyebrow">CURATED WITH INTENTION</div><img class="preview-img" src="outfit-board.jpg" alt="Editorial examples of three complete outfit boards"><h3>One vision. Three directions.</h3><p>Chic Statement. Streetwear Statement. Fashion-Forward Statement. Each designed to feel distinctly you.</p><div class="atelier-facts"><div><strong>${count}</strong><span>Closet pieces</span></div><div><strong>${state.dna.dial}%</strong><span>Statement dial</span></div></div><div class="notice">Styling previews are editorial references, not AI-generated looks.</div>${btn('Explore Three-Look Results','results','btn ghost')}</div></aside></div></div>`} 
function results(){const directions=['Chic Statement','Streetwear Statement','Fashion-Forward Statement'];return `<div class="page studio-results">${banner('Three-Look Results','Three ways to make an entrance. One unmistakable signature.')}<div class="results-header card"><div><div class="eyebrow">YOUR LATEST STYLING BRIEF</div><h2>${state.request?'The vision you saved':'Your styling story starts here'}</h2><p>${esc(state.request||'Write your first styling request in Style My Day to begin.')}</p><div class="chips"><span class="pill">${esc(state.occasion)}</span><span class="pill">${state.dna.dial}% Statement Maker</span><span class="pill">${esc(state.mode)}</span></div></div>${btn('Edit My Brief','style','btn ghost')}</div><div class="results-section-heading"><div><div class="eyebrow">THE THREE-LOOK EDIT</div><h2>Your three signature directions</h2></div><span class="pill">Preview · AI not connected</span></div><div class="look-editorial-grid">${directions.map((x,i)=>`<article class="card editorial-look"><div class="look-topline"><span>LOOK 0${i+1}</span><span>✦ EDITORIAL DIRECTION</span></div><div class="look-stage"><div class="look-ornament">${['01','02','03'][i]}</div><div class="look-stage-copy">Your ${x.toLowerCase()} outfit will appear here after AI styling is connected.</div></div><h3>${x}</h3><p class="muted">${['Refined pieces, expressive details, and effortless sophistication.','Creative proportions and unexpected combinations with confidence.','A fashion-forward point of view with standout finishing touches.'][i]}</p><div class="look-actions"><button data-action="look-unavailable">Swap Item</button><button data-action="look-unavailable">Regenerate</button><button data-action="look-unavailable">View Collage</button><button data-page="Virtual Try-On">Try On</button></div></article>`).join('')}</div><div class="results-footer card"><div><h3>Ready for the real reveal?</h3><p>Once a secure AI service is connected, your actual closet pieces and optional suggestions can populate these cards. No imaginary outfits are being passed off as results.</p></div><div class="actions">${btn('Save Selected','look-unavailable')}${btn('Save All','look-unavailable','btn ghost')}${btn('Generate 3 New Looks','style','btn ghost')}</div></div><div class="card styling-notes"><div class="eyebrow">A NOTE FROM YOUR STYLIST</div><p>Your request leads the styling process. We'll preserve the difference between what is in your closet and what is suggested for you.</p></div></div>`}
function dna(){const d=state.dna,personas=['Chic Statement','Streetwear Statement','Fashion-Forward Statement','Classic & Polished','Feminine & Flirty','Bold & Edgy'],interests=['Work / Corporate','Casual / Everyday','Night Out','Travel','Events & Special Occasions','Church / Faith Looks','Weekend / Off Duty','Seasonal Style','Trends & New Looks','Capsule Wardrobe'];return `<div class="page signature-page dna-page">${banner('My Style DNA','Define your style, preferences, and fashion personality so your stylist can create looks that feel uniquely you.')}<div class="signature-tabs"><button class="chip selected" data-action="dna-tab">My Style DNA</button><button class="chip" data-action="dna-tab">Style Profile</button><button class="chip" data-action="dna-tab">Look Preferences</button><button class="chip" data-action="dna-tab">Style Goals</button></div><div class="dna-main"><section class="card"><h2>Your Style Personality</h2><p>Choose up to three that best describe your style.</p><div class="personality-grid">${personas.map((x,i)=>`<button class="personality-tile ${(d.focus||[]).includes(x)?'chosen':''}" data-focus="${x}" aria-pressed="${(d.focus||[]).includes(x)}"><img src="${['tile-stylist.jpg','tile-inspiration.jpg','hero-editorial.jpg','tile-closet.jpg','tile-tryon.jpg','tile-saved.jpg'][i]}" alt=""><span>${x}</span></button>`).join('')}</div></section><aside class="card dna-summary"><h2>✦ Your Style DNA Summary</h2><p><b>Primary style:</b> ${esc((d.focus||[])[0]||'Not selected')}</p><p><b>Also love:</b> ${esc((d.focus||[]).slice(1).join(', ')||'Choose more styles')}</p><p><b>Statement dial:</b> ${d.dial}%</p><p>“You don't need a different body. You need a style that celebrates yours.”</p></aside></div><div class="dna-preferences"><section class="card"><h2>Your Style Dial</h2><div class="field"><label for="dnaDial">Statement Maker — <b id="dnaDialLabel">${d.dial}%</b></label><input id="dnaDial" class="dial" type="range" min="0" max="100" value="${d.dial}"><div class="dial-ends"><span>Everyday Chic</span><span>Bold & Editorial</span></div></div><h2>Your Style Interests</h2><div class="chips">${interests.map(x=>`<button class="chip ${(d.interests||[]).includes(x)?'selected':''}" data-interest="${x}">${x}</button>`).join('')}</div></section><section class="card"><h2>Your Color Palette</h2><p>Choose your go-to colors or enter your favorites.</p><div class="swatches">${['#f5ead4','#b6a18d','#bd8557','#4d5a3c','#23486a','#161414','#e7a6a6','#999b9a','#fff','#c49a4a'].map((x,i)=>`<button type="button" class="swatch" style="background:${x}" data-swatch="${['Ivory','Taupe','Camel','Olive','Navy','Black','Blush','Gray','White','Gold'][i]}" aria-label="Add ${['Ivory','Taupe','Camel','Olive','Navy','Black','Blush','Gray','White','Gold'][i]}"></button>`).join('')}</div><div class="field"><label for="colors">Favorite colors</label><input id="colors" value="${esc(d.colors||'')}" placeholder="Ivory, camel, olive..."></div><h2>Your Fit & Silhouette Preferences</h2><div class="field"><label for="fit">Silhouettes you love</label><textarea id="fit" placeholder="Fitted, relaxed, tailored, flowy, cropped, layered...">${esc(d.fit||'')}</textarea></div></section></div><div class="card"><h2>About Your Style (Optional)</h2><div class="field"><label for="bio">Your fashion personality</label><textarea id="bio" placeholder="Describe your style, lifestyle and fashion goals...">${esc(d.bio||'')}</textarea></div><div class="field"><label for="notes">Extra styling notes</label><textarea id="notes" placeholder="Pieces you love, things you'd like to try...">${esc(d.notes||'')}</textarea></div>${btn('✦ Save My Style DNA','save-dna')}</div></div>`}
function tryon(){const tab=window.tryonTab||'Try Looks on Me';return `<div class="page signature-page">${banner('Virtual Try-On','See how looks come together on you. Try, style, and build outfits before you buy.')}<div class="signature-tabs">${['Try Looks on Me','Virtual Model','Body Profile','Style This Piece'].map(x=>`<button class="chip ${tab===x?'selected':''}" data-trytab="${x}">${x}</button>`).join('')}</div><div class="tryon-layout"><section class="card"><h2>Choose a Look</h2><div class="tryon-sources">${[['My Closet','My Virtual Closet'],['AI Stylist Looks','Three-Look Results'],['Inspiration Library','Inspiration Library'],['Saved Looks','Saved Looks']].map(([x,y])=>`<button data-page="${y}">${x} <span>›</span></button>`).join('')}</div><h3>Or Upload a Look</h3>${btn('＋ Upload a Photo','tryon-upload','btn ghost')}<p class="muted">Outfit, item, or inspiration image</p></section><section class="card tryon-stage"><h2>${esc(tab)}</h2><div class="comparison"><div class="comparison-side"><img src="hero-editorial.jpg" alt="Editorial model reference, not your photo"><span>Your Photo</span></div><div class="comparison-side"><img src="tile-tryon.jpg" alt="Virtual try-on concept image, not an AI result"><span>Try-On Preview</span></div></div><p class="muted">Illustrative previews only. No generated try-on or body-fit prediction is available yet.</p><h3>More Try-On Looks</h3><div class="tryon-strip">${['tile-stylist.jpg','tile-inspiration.jpg','tile-closet.jpg','tile-saved.jpg'].map(x=>`<img src="${x}" alt="Editorial outfit inspiration">`).join('')}</div></section><aside class="card"><h2>Customize My Try-On</h2><p class="muted">Base model</p><div class="tryon-sources"><button data-action="tryon-info">Use My Photo <span>Most accurate*</span></button><button data-action="tryon-info">Use Virtual Model <span>Customizable*</span></button>${['Fit & Proportions','Skin Tone & Features','Hair: Style, Length, Color','Background / Setting'].map(x=>`<button data-action="tryon-info">${x}<span>›</span></button>`).join('')}</div><p class="muted">*Planned capabilities; not active yet.</p>${btn('✦ Generate Try-On','tryon-info')}<div class="actions">${btn('Save Look','tryon-info','btn ghost')}${btn('Share','tryon-info','btn ghost')}</div></aside></div></div>`}
function saved(){const groups=state.collections||[];return `<div class="page signature-page">${banner('Saved Looks','Your signature looks, curated collections, and fashion memories.')}<div class="section-head"><h2>My Collections</h2><span class="pill">${groups.length} collections</span></div><div class="collection-grid">${groups.map(x=>`<button class="collection-card" data-collection="${esc(x.id)}"><span>♡</span><strong>${esc(x.name)}</strong><small>View collection</small></button>`).join('')||'<div class="empty">Your curated collections will appear here.</div>'}</div><div class="section-head"><h2>My Saved Looks</h2><span class="pill">${state.saved.length} saved</span></div><div class="signature-gallery">${cards(state.saved,'saved')}</div><div class="saved-toolbar">${btn('＋ Create Collection','collection')}${btn('Add Saved Photo','add-saved','btn ghost')}${btn('Export My Data','export','btn ghost')}</div></div>`}
function render(){navs();const pages={'Home':home,'Style My Day':styling,'Three-Look Results':results,'My Virtual Closet':()=>gallery('closet'),'My Style DNA':dna,'Inspiration Library':()=>gallery('inspo'),'Virtual Try-On':tryon,'Saved Looks':saved};$('#app').innerHTML=(pages[page]||home)()}
function dialog(html){$('#dialog').innerHTML=html+'<div class="actions"><button class="btn ghost" data-action="close">Close</button></div>';$('#dialog').showModal()}function resize(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const scale=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}
function edit(type,key){const item=state[type].find(x=>x.id===key);if(!item)return;editTarget={type,key};dialog(`<h2>Edit ${esc(item.name)}</h2><div class="field"><label for="editName">Name</label><input id="editName" value="${esc(item.name)}"></div><div class="field"><label for="editCategory">Category</label><input id="editCategory" value="${esc(item.category||'Uncategorized')}"></div><div class="field"><label for="editNote">Notes</label><textarea id="editNote">${esc(item.note||'')}</textarea></div><div class="actions">${btn('Save Changes','save-edit')}${btn('Replace Photo','replace-photo','btn ghost')}</div>`)}function exportData(){const blob=new Blob([JSON.stringify({format:'tla-personal-studio-sweep1',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='the-look-assembled-personal-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function pick(type){pickerType=type;$('#filePicker').multiple=type!=='replace';$('#filePicker').value='';$('#filePicker').click()}
function crop(key){const item=state.inspo.find(x=>x.id===key);if(!item)return;editTarget={type:'inspo',key};cropOriginal=item.data;dialog(`<h2>Crop & Focus</h2><p class="muted">Choose a centered crop ratio. The original stays safe unless you explicitly replace it.</p><div class="crop-area"><img src="${item.data}" alt="Original image"></div><div class="field"><label for="cropRatio">Crop shape</label><select id="cropRatio"><option value="1">Square (1:1)</option><option value="0.75">Portrait (3:4)</option><option value="1.7778">Wide (16:9)</option></select></div><div class="actions">${btn('Save as New Photo','crop-new')}${btn('Save & Replace Original','crop-replace','btn ghost')}</div>`)}async function cropSave(replace){const ratio=Number($('#cropRatio').value),im=new Image();im.src=cropOriginal;await im.decode();let w=im.width,h=im.height;if(w/h>ratio)w=h*ratio;else h=w/ratio;const c=document.createElement('canvas');const scale=Math.min(1,1000/Math.max(w,h));c.width=Math.round(w*scale);c.height=Math.round(h*scale);c.getContext('2d').drawImage(im,(im.width-w)/2,(im.height-h)/2,w,h,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.78);const item=state.inspo.find(x=>x.id===editTarget.key);if(!item)return;if(replace){if(!confirm('Replace the original photo with this crop? This cannot be undone unless you exported a backup.'))return;item.data=data}else state.inspo.push({...item,id:id(),name:item.name+' (crop)',data});if(save()){$('#dialog').close();render()}}
function action(a){if(a==='close'){$('#dialog').close();return}if(a==='browse-inspo'){go('Inspiration Library');return}if(a==='dna-tab'){dialog('<h2>My Style DNA</h2><p>Use the personality, interests, palette, silhouette and notes sections below to define your signature style.</p>');return}if(a==='tryon-upload'){dialog('<h2>Try-On Photo</h2><p>Photo-based try-on is not connected to an image-generation service yet. Your photos are not sent anywhere.</p>');return}if(a.startsWith('add-')){pick(a.slice(4));return}if(a==='export'){exportData();return}if(a==='save-edit'){const item=state[editTarget.type].find(x=>x.id===editTarget.key);if(item){item.name=$('#editName').value.trim()||item.name;item.category=$('#editCategory').value.trim()||'Uncategorized';item.note=$('#editNote').value;save()}$('#dialog').close();render();return}if(a==='replace-photo'){pick('replace');return}if(a==='crop-new'||a==='crop-replace'){cropSave(a==='crop-replace');return}if(a==='clear-select'){selected.clear();render();return}if(a==='bulk-delete'){if(!selected.size)return alert('Select some items first.');const type=page==='My Virtual Closet'?'closet':page==='Inspiration Library'?'inspo':'saved';if(confirm(`Delete ${selected.size} selected item(s)?`)){state[type]=state[type].filter(x=>!selected.has(x.id));selected.clear();save();render()}return}if(a==='categories'){const names=[...new Set(state.closet.map(x=>x.category||'Uncategorized'))];dialog(`<h2>Manage Closet Categories</h2><p>Rename a category to move its pieces together. Removing a category moves its pieces to Uncategorized; photos are never deleted.</p><div class="field"><label for="oldCategory">Current category</label><select id="oldCategory">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div><div class="field"><label for="newCategory">New category name</label><input id="newCategory" placeholder="e.g. Dresses"></div><div class="actions">${btn('Rename / Move','rename-category')}${btn('Remove Category','remove-category','btn danger')}</div>`);return}if(a==='rename-category'||a==='remove-category'){const old=$('#oldCategory')?.value,nu=a==='remove-category'?'Uncategorized':$('#newCategory')?.value.trim();if(!old||!nu)return alert('Enter a category name.');if(a==='remove-category'&&!confirm(`Move all ${old} items to Uncategorized?`))return;state.closet.forEach(x=>{if((x.category||'Uncategorized')===old)x.category=nu});save();$('#dialog').close();render();return}if(a==='collection'){dialog(`<h2>Create Collection</h2><div class="field"><label for="collectionName">Collection name</label><input id="collectionName" placeholder="Weekend Chic"></div>${btn('Create Collection','save-collection')}`);return}if(a==='save-collection'){const name=$('#collectionName').value.trim();if(!name)return alert('Enter a collection name.');state.collections.push({id:id(),name});save();$('#dialog').close();render();return}if(a==='save-dna'){for(const x of ['bio','colors','fit','notes'])state.dna[x]=$('#'+x).value;save();alert('Your Style DNA has been saved in this browser.');return}if(a==='generate'){state.request=$('#request').value;state.mode=$('#mode').value;save();dialog(`<h2>Your Styling Brief Is Saved ✨</h2><p>We've saved your request, ${esc(state.occasion)} occasion, and ${state.dna.dial}% Statement Maker dial.</p><p>AI styling is not connected in this release. Creating three real closet-based looks requires a secure AI backend. We won't invent results or pretend the service is running.</p>${btn('View Results Layout','results','btn ghost')}`);return}if(a==='results'){if($('#dialog').open)$('#dialog').close();go('Three-Look Results');return}if(a==='style'){go('Style My Day');return}if(a==='closet'){go('My Virtual Closet');return}if(a==='recreate-info'||a==='tryon-info'||a==='look-unavailable'){dialog(`<h2>AI Feature Coming Next</h2><p>This interaction needs an AI image or styling service. The interface is ready for integration, but generation is not enabled yet.</p>`);return}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){if($('#dialog').open)$('#dialog').close();go(nav.dataset.page);return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}const f=e.target.closest('[data-filter]');if(f){if(f.dataset.filterType==='closet')filter=f.dataset.filter;else inspoFilter=f.dataset.filter;selected.clear();render();return}const intr=e.target.closest('[data-interest]');if(intr){const x=intr.dataset.interest,arr=state.dna.interests||[];state.dna.interests=arr.includes(x)?arr.filter(v=>v!==x):[...arr,x];save();render();return}const sw=e.target.closest('[data-swatch]');if(sw){const el=$('#colors');if(el){const v=el.value.split(',').map(x=>x.trim()).filter(Boolean);if(!v.includes(sw.dataset.swatch))v.push(sw.dataset.swatch);el.value=v.join(', ');}return}const tab=e.target.closest('[data-trytab]');if(tab){window.tryonTab=tab.dataset.trytab;render();return}const occ=e.target.closest('[data-occasion]');if(occ){state.occasion=occ.dataset.occasion;save();render();return}const focus=e.target.closest('[data-focus]');if(focus){const arr=state.dna.focus||[];if(arr.includes(focus.dataset.focus))state.dna.focus=arr.filter(x=>x!==focus.dataset.focus);else if(arr.length<3)state.dna.focus=[...arr,focus.dataset.focus];else return alert('Choose up to three styling directions.');save();render();return}const editBtn=e.target.closest('[data-edit]');if(editBtn){const [t,k]=editBtn.dataset.edit.split(':');edit(t,k);return}const remove=e.target.closest('[data-remove]');if(remove){const [t,k]=remove.dataset.remove.split(':');if(confirm('Delete this photo? This cannot be undone without a backup.')){state[t]=state[t].filter(x=>x.id!==k);save();render()}return}const fav=e.target.closest('[data-favorite]');if(fav){const [t,k]=fav.dataset.favorite.split(':');const item=state[t].find(x=>x.id===k);if(item){item.favorite=!item.favorite;save();render()}return}const cropbtn=e.target.closest('[data-crop]');if(cropbtn){crop(cropbtn.dataset.crop);return}const col=e.target.closest('[data-collection]');if(col){const c=state.collections.find(x=>x.id===col.dataset.collection);if(c)dialog(`<h2>${esc(c.name)}</h2><p>Collection created. Assigning generated outfits to collections will be enabled with the styling engine.</p>`);return}});document.addEventListener('change',e=>{if(e.target.matches('[data-select]')){if(e.target.checked)selected.add(e.target.dataset.select);else selected.delete(e.target.dataset.select);const b=$('[data-action="bulk-delete"]');if(b)b.textContent=`Delete Selected (${selected.size})`;return}if(e.target.id==='mode'){state.mode=e.target.value;save();return}});document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();const s=$('#search');s.focus();s.setSelectionRange(pos,pos);return}if(e.target.id==='dial'||e.target.id==='dnaDial'){state.dna.dial=Number(e.target.value);const lab=$('#dialLabel')||$('#dnaDialLabel');if(lab)lab.textContent=state.dna.dial+(e.target.id==='dial'?'% Statement Maker':'%');save();return}});$('#filePicker').addEventListener('change',async e=>{const files=[...e.target.files];if(files.length>15)return alert('Please upload up to 15 images at a time.');for(const f of files){if(!f.type.startsWith('image/'))continue;try{const data=await resize(f);if(pickerType==='replace'){const item=state[editTarget.type].find(x=>x.id===editTarget.key);if(item){item.data=data;save()}break}const item={id:id(),name:f.name.replace(/\.[^.]+$/,''),category:'Uncategorized',note:'',data,favorite:false};state[pickerType].push(item);if(!save()){state[pickerType].pop();break}}catch{alert('Could not import '+f.name)}}if($('#dialog').open)$('#dialog').close();render()});for(const type of ['closet','inspo','saved'])state[type].forEach(x=>{if(!x.id)x.id=id()});save();render();
</script></body></html>
