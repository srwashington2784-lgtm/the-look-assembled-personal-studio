<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241712"><link rel="manifest" href="manifest.webmanifest"><title>The Look Assembled | Personal Stylist Studio</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f9eddd;background:#170f0d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#2b1a15,#160e0c 55%);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #f6ce89;outline-offset:2px}.shell{max-width:1200px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#21140f;border-right:1px solid #5b3e2c;padding:30px 17px;position:sticky;top:0;height:100vh}.brand{font-family:Georgia,serif;color:#f0c785;font-size:24px;line-height:1.1;margin-bottom:7px}.subbrand{font-size:10px;letter-spacing:.22em;color:#c6a68b;margin-bottom:35px}.nav{display:grid;gap:8px}.nav button,.mobile-nav button{border:0;background:transparent;color:#dcc4ac;text-align:left;padding:13px;border-radius:12px}.nav button.active,.mobile-nav button.active{background:#593a29;color:#ffda95}.content{padding:34px clamp(18px,4vw,55px) 100px;min-width:0}.eyebrow{letter-spacing:.22em;color:#e6b96f;text-transform:uppercase;font-size:11px;font-weight:700}h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{font-size:clamp(31px,5vw,53px);margin:12px 0}h2{font-size:28px}p{line-height:1.55;color:#d6bba7}.hero{border:1px solid #806047;border-radius:24px;background:radial-gradient(circle at 83% 20%,#775038,#362119 50%,#22140f);padding:clamp(26px,5vw,60px);min-height:290px;display:flex;flex-direction:column;justify-content:center}.hero h1{max-width:600px}.hero p{max-width:590px}.btn{border:1px solid #bd8b4d;background:#c69a5d;color:#25150e;font-weight:700;border-radius:12px;padding:12px 17px}.btn.secondary{background:transparent;color:#f0d2a3}.btn:disabled{opacity:.5;cursor:not-allowed}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{background:#2b1b16;border:1px solid #62422f;border-radius:18px;padding:17px;min-width:0}.tile h3{margin:5px 0}.tile p{margin:8px 0;font-size:14px}.photo{width:100%;aspect-ratio:3/4;object-fit:cover;background:linear-gradient(135deg,#785b42,#36251e);border-radius:12px}.placeholder{aspect-ratio:3/4;background:linear-gradient(140deg,#77543b,#2c1b15);border-radius:12px;display:grid;place-items:center;color:#f3cf9c;font-family:Georgia,serif;font-size:32px}.note{border-left:3px solid #d2a267;padding:11px 15px;background:#2b1c15;color:#dfc6ac;border-radius:5px;font-size:13px;margin:20px 0}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;color:#e5c79d}.field input,.field select,.field textarea{width:100%;background:#1a110f;border:1px solid #76543d;border-radius:10px;color:#fff0dc;padding:12px}.field textarea{min-height:100px}.pill{display:inline-block;border:1px solid #906c48;border-radius:99px;padding:6px 10px;font-size:12px;color:#ebc891}.mobile-nav{display:none}.muted{font-size:13px;color:#c5aa94}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stack{display:grid;gap:12px}.range{width:100%;accent-color:#d3a269}.small{font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{padding:8px 11px;border:1px solid #926947;background:transparent;color:#f4d7b4;border-radius:8px}.section{margin:30px 0}.hidden{display:none!important}@media(max-width:800px){.shell{display:block}.sidebar{display:none}.content{padding:22px 16px 110px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#231610;border-top:1px solid #78563a;padding:8px 4px max(9px,env(safe-area-inset-bottom));z-index:10}.mobile-nav button{text-align:center;padding:9px 1px;font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:12px}.two{grid-template-columns:1fr}.hero{min-height:260px}.nav{display:none}}@media(max-width:350px){.mobile-nav button{font-size:10px}.grid{gap:8px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">THE LOOK<br>ASSEMBLED</div><div class="subbrand">PERSONAL STYLIST STUDIO</div><nav class="nav" id="desktopNav"></nav><p class="muted" style="margin-top:40px">Mocha After Dark · Starter Edition</p></aside><main class="content" id="app"></main></div><nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"></nav><script>
const PAGES=['Home','Style My Day','Three-Look Results','My Virtual Closet','My Style DNA','Inspiration Library','Virtual Try-On','Saved Looks'];const MAIN=[['Home','Home'],['Closet','My Virtual Closet'],['Style','Style My Day'],['Inspo','Inspiration Library'],['Saved','Saved Looks']];let current='Home';const KEY='tla-personal-studio-starter-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{closet:[],inspo:[],saved:[],dna:{dial:55}}}catch{state={closet:[],inspo:[],saved:[],dna:{dial:55}}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Local browser storage is full. Your newest change could not be saved. Please export your data before adding more photos.');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(page){current=page;render();window.scrollTo(0,0)}function button(text,page,cls='btn'){return `<button class="${cls}" data-page="${esc(page)}">${text}</button>`}function header(title,description){return `<div class="eyebrow">THE LOOK ASSEMBLED · PERSONAL STUDIO</div><h1>${title}</h1><p>${description}</p>`}function placeholder(name){return `<div class="placeholder" aria-label="Placeholder image">✦</div><h3>${name}</h3>`}function renderNav(){document.getElementById('desktopNav').innerHTML=PAGES.map(p=>`<button data-page="${esc(p)}" class="${p===current?'active':''}">${p}</button>`).join('');document.getElementById('mobileNav').innerHTML=MAIN.map(([short,p])=>`<button data-page="${esc(p)}" class="${p===current?'active':''}">${short}</button>`).join('')}
function photoCards(items,type){if(!items.length)return `<div class="note">No photos yet. Add a photo to begin building your personal collection.</div>`;return `<div class="grid">${items.map((item,i)=>`<article class="tile"><img class="photo" src="${item.data}" alt="${esc(item.name)}"><h3>${esc(item.name)}</h3><p class="muted">${esc(item.category||'Uncategorized')}</p><div class="actions"><button data-rename="${type}:${i}">Edit</button><button data-remove="${type}:${i}">Delete</button></div></article>`).join('')}</div>`}
function gallery(type,title,description){return header(title,description)+`<div class="toolbar"><label class="btn" for="upload">+ Add Photos</label><input id="upload" type="file" accept="image/*" multiple class="hidden" data-type="${type}"><button class="btn secondary" data-export>Export Starter Data</button></div><div class="note">Photos are saved only in this browser's local storage in this starter. They are not synced across devices. Export regularly; large collections require a future database upgrade. Your original Outfit Roulette photos are not accessed.</div>${photoCards(state[type],type)}`}
function render(){renderNav();let html='';switch(current){case 'Home':html=`<section class="hero"><div class="eyebrow">THE LOOK ASSEMBLED · MOCHA AFTER DARK</div><h1>Ordinary was Never the Assignment.</h1><p>One app. Your closet. Your inspiration. AI does the styling.</p><div class="toolbar">${button('STYLE MY DAY','Style My Day')}</div></section><section class="section"><h2>Your Styling Suite</h2><div class="grid">${[['My Virtual Closet','Organize your wardrobe'],['Inspiration Library','Keep your fashion inspiration'],['My Style DNA','Discover your style'],['Virtual Try-On','Preview the possibilities'],['Saved Looks','Keep the looks you love'],['Three-Look Results','Explore styling results']].map(([a,b])=>`<article class="tile"><div class="eyebrow">✦ STYLE STUDIO</div><h3>${a}</h3><p>${b}</p>${button('Explore',a,'btn secondary')}</article>`).join('')}</div></section><div class="note">This is an original functional starter, not a pixel-perfect reproduction of previously approved imagery. Final visual implementation requires the approved image assets and reference screens.</div>`;break;
case 'My Virtual Closet':html=gallery('closet','My Virtual Closet','Your wardrobe, beautifully organized. Add photos, rename items, and manage your starter collection.');break;
case 'Inspiration Library':html=gallery('inspo','Inspiration Library','Collect inspiration images. AI analysis, Crop & Focus, and recreate-from-closet are planned for a later build.');break;
case 'Style My Day':html=header('Style My Day','Tell your stylist what you want. Your instructions always come first.')+`<div class="two"><div class="tile"><div class="field"><label for="request">What are we styling for?</label><textarea id="request" placeholder="Chic brunch with heels, please..."></textarea></div><div class="field"><label for="mode">Styling Mode</label><select id="mode"><option>Closet Only</option><option>Closet + Suggestions</option></select></div><div class="field"><label for="dial">Style Dial — <span id="dialVal">${state.dna.dial}</span>% Statement Maker</label><input id="dial" class="range" type="range" min="0" max="100" value="${state.dna.dial}"></div><button class="btn" id="createLooks">Create My Looks</button><div class="note">AI generation is not connected yet. This button explains the next integration step rather than inventing outfits.</div></div><div class="tile">${placeholder('Your style. Your rules.')}<p>Default: Closet Only. Three fully styled, distinct looks. Request first; optional alternatives afterward.</p></div></div>`;break;
case 'Three-Look Results':html=header('Three-Look Results','Three complete looks, each with its own personality.')+`<div class="grid">${['Look One','Look Two','Look Three'].map((x,i)=>`<div class="tile">${placeholder(x)}<p>Once AI is connected, this space will show real closet-based outfit results, with Swap, Lock, Regenerate, Try On and Save.</p></div>`).join('')}</div><div class="note">No generated outfits are displayed yet. Placeholder panels are intentional.</div>`;break;
case 'My Style DNA':html=header('My Style DNA','A style profile that belongs to you—and evolves with you.')+`<div class="tile"><div class="field"><label for="styleBio">Your style in your own words</label><textarea id="styleBio" placeholder="Chic, feminine, statement pieces...">${esc(state.dna.bio||'')}</textarea></div><div class="field"><label for="dial">Style Dial — <span id="dialVal">${state.dna.dial}</span>%</label><input id="dial" class="range" type="range" min="0" max="100" value="${state.dna.dial}"></div><button class="btn" id="saveDNA">Save My Style DNA</button><p class="muted">AI style consultation, optional body profile, and photo-based analysis will be integrated later.</p></div>`;break;
case 'Virtual Try-On':html=header('Virtual Try-On','Explore how looks might come together on you or a customizable model.')+`<div class="two"><div class="tile">${placeholder('Your Photo')}</div><div class="tile">${placeholder('Outfit Preview')}</div></div><div class="note">Virtual try-on is a planned AI integration. No personal photo is uploaded or processed by this screen in the starter.</div>`;break;
case 'Saved Looks':html=header('Saved Looks','Your favorite outfit combinations, collections, and memories.')+`<div class="toolbar"><button class="btn" id="createCollection">+ Create Collection</button></div><div class="note">Collection creation and AI-generated look saving will be implemented with the styling engine. This starter does not fabricate saved outfits.</div>${photoCards(state.saved,'saved')}`;break;}
document.getElementById('app').innerHTML=html}
function resize(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.7))};img.src=reader.result};reader.readAsDataURL(file)})}document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){nav(p.dataset.page);return}const del=e.target.closest('[data-remove]');if(del){const [type,n]=del.dataset.remove.split(':');if(confirm('Delete this item from this starter collection?')){state[type].splice(Number(n),1);persist();render()}return}const rename=e.target.closest('[data-rename]');if(rename){const [type,n]=rename.dataset.rename.split(':');const item=state[type][Number(n)];const name=prompt('Item name:',item.name);if(name!==null&&name.trim()){item.name=name.trim();persist();render()}return}if(e.target.closest('[data-export]')){const blob=new Blob([JSON.stringify({format:'tla-starter-v1',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='the-look-assembled-starter-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}if(e.target.id==='createLooks'){alert('AI styling is not connected in this starter. The next build phase will add a secure AI backend that uses your actual closet items.');return}if(e.target.id==='saveDNA'){state.dna.bio=document.getElementById('styleBio').value;persist();alert('Style DNA saved in this browser.');return}if(e.target.id==='createCollection'){alert('Saved Look collections will be enabled when the styling engine is connected.');return}});document.addEventListener('input',e=>{if(e.target.id==='dial'){document.getElementById('dialVal').textContent=e.target.value;state.dna.dial=Number(e.target.value);persist()}});document.addEventListener('change',async e=>{if(e.target.id!=='upload')return;const type=e.target.dataset.type;const files=[...e.target.files];if(!files.length)return;if(files.length>15){alert('Please add up to 15 photos at a time in this starter.');return}for(const f of files){if(!f.type.startsWith('image/'))continue;try{const data=await resize(f);state[type].push({name:f.name,category:'Uncategorized',data});if(!persist()){state[type].pop();break}}catch(err){alert('Could not import '+f.name)}}render()});render();
</script></body></html>
